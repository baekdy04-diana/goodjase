<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ErgoFit 작업환경 점검</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ============ 머리글: 로고 + 메뉴 (휴대폰에서는 메뉴가 아래쪽 탭으로 바뀝니다) ============ -->
<header class="topbar">
  <div class="topbar-inner wide">
    <a class="logo" href="#home">Ergo<span>Fit</span></a>
    <nav class="tabbar" id="nav" aria-label="주요 메뉴">
      <a href="#home" data-page="home"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H15v-5.5H9V20H4z"/></svg><span>홈</span></a>
      <a href="#result" data-page="result"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/></svg><span>결과</span></a>
      <a href="#guide" data-page="guide"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span>가이드</span></a>
      <a href="#practice" data-page="practice"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg><span>실천</span></a>
      <a href="#record" data-page="record"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg><span>기록</span></a>
    </nav>
  </div>
</header>

<main>

  <!-- ============ 1. 홈 ============ -->
  <section class="page" id="page-home">
    <div class="hero wide">
      <div class="stack">
        <h1>당신의 자세는<br>몇 점인가요?</h1>
        <p class="lead">바른 자세는 의지보다 환경입니다. 3분 점검으로 점수와 먼저 고칠 세 가지를 받아 보세요.</p>
        <div><a class="btn big" href="#survey">내 자세 점수 확인하기 →</a></div>
        <div class="facts">
          <span><strong>14문항</strong> · 약 3분</span>
          <span><strong>RULA·ROSA</strong> 평가 항목 참고</span>
          <span>기록은 <strong>내 브라우저에만</strong> 저장</span>
        </div>
        <div id="home-last"></div>
      </div>
      <div class="hero-figure figure" id="home-figure"></div>
    </div>
  </section>

  <!-- ============ 2. 설문 (집중 화면) ============ -->
  <section class="page" id="page-survey">
    <div class="narrow stack">
      <div class="survey-top">
        <a class="back" href="#home"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>나가기</a>
        <span class="caption num" id="survey-count"></span>
      </div>
      <div class="bar thin"><div id="survey-progress"></div></div>
      <h1 class="page-title" id="survey-title"></h1>
      <form class="stack" id="survey-form"></form>
      <div class="survey-actions">
        <p class="error" id="survey-error" role="alert"></p>
        <div class="row">
          <button class="btn ghost" id="btn-prev" type="button">이전</button>
          <button class="btn" id="btn-next" type="button">다음</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 3. 결과 / 4. 개선 가이드 / 5. 실천 / 6. 기록 ============ -->
  <section class="page" id="page-result"><div class="narrow stack" id="result-body"></div></section>
  <section class="page" id="page-guide"><div class="narrow stack" id="guide-body"></div></section>
  <section class="page" id="page-practice"><div class="narrow stack" id="practice-body"></div></section>
  <section class="page" id="page-record"><div class="narrow stack" id="record-body"></div></section>

</main>

<footer>ErgoFit은 RULA·ROSA의 평가 항목을 참고해 만든 간이 자가 점검 도구입니다. 공식 평가 점수나 의료 진단을 대신하지 않습니다. 통증이 계속되면 전문가와 상담하세요.</footer>

<!-- ============ 아래에서 올라오는 설명 창 (결과 페이지의 몸 그림을 누르면 열림) ============ -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <button class="sheet-close" id="sheet-close" type="button" aria-label="닫기"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="stack" id="sheet-body"></div>
</section>

<script src="script.js"></script>
</body>
</html>
